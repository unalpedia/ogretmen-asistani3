    };

    // ==================== BACKUP UTILITIES ====================
    const makeBackup = (classes) => {
      const data = { version:16, created: new Date().toISOString(), classes, payload:{} };
      (classes || []).forEach(c => {
        const students = storage.get(`s13_${c.id}`, []);
        const homeworks = storage.get(`h13_${c.id}`, []);
        const exams = storage.get(`e13_${c.id}`, []);
        data.payload[c.id] = { students, homeworks, exams };
      });
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); 
      a.href = url; 
      a.download = `asistanv16_backup_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`; 
      document.body.appendChild(a); 
      a.click(); 
      a.remove();
      URL.revokeObjectURL(url);
    };

    // ==================== V16: BACKUP RESTORE (v13/v14/v15/v16 geriye dönük uyumlu) ====================
    const restoreFromBackupFile = async (file) => {
      try {
        const text = await file.text(); 
        const parsed = JSON.parse(text);
        if (!parsed || !parsed.classes) throw new Error('Geçersiz yedek dosyası');
        const fileVersion = parsed.version || 13;
        if (!confirm(`V${fileVersion} yedek dosyası yüklenecek. Mevcut veriler üzerine yazılacak. Devam edilsin mi?`)) return { success:false, message:'Kullanıcı iptal etti' };
        storage.set('ap_v13_classes', parsed.classes);
        parsed.classes.forEach(c => {
          const payload = parsed.payload?.[c.id] || { students:[], homeworks:[], exams:[] };
          storage.set(`s13_${c.id}`, payload.students || []);
          storage.set(`h13_${c.id}`, payload.homeworks || []);
          storage.set(`e13_${c.id}`, payload.exams || []);
        });
        return { success:true, parsed };
      } catch (e) { 
        console.error(e); 
        return { success:false, message: e.message || 'Hata' }; 
      }
    };

    // ==================== V16: RANK PAGE (Sınıf Seviyesi Karşılaştırması) ====================
    function RankPage({ students, classes, selClass, rankMode, setRankMode, rankingData, getWeeklyPointsForStudent, setDetailStudent, storage }) {
      // Sınıf adından seviye grubu çıkar: "6-A", "6B", "6. Sınıf A" → "6"
      function extractGradeGroup(name = '') {
        const m = name.match(/(\d{1,2})/);
        return m ? m[1] : null;
      }

      const currentGrade = extractGradeGroup(selClass?.name || '');

      // Aynı seviyedeki diğer sınıfları bul
      const sameGradeClasses = classes.filter(c => {
        const g = extractGradeGroup(c.name);
        return g === currentGrade;
      });

      const [compareClassId, setCompareClassId] = useState('__current__');

      // Karşılaştırma sınıfının öğrencilerini yükle
      const [compareStudents, setCompareStudents] = useState([]);
      useEffect(() => {
        if (compareClassId === '__current__') {
          setCompareStudents(students);
        } else {
          const loaded = storage.get(`s13_${compareClassId}`, []);
          setCompareStudents(loaded);
        }
      }, [compareClassId, students]);

      // Seçili moda göre sırala
      const displayStudents = [...compareStudents].sort((a, b) => {
        if (rankMode === 'weekly') {
          return getWeeklyPointsForStudent(b) - getWeeklyPointsForStudent(a);
        }
        return (b.puan || 0) - (a.puan || 0);
      });

      const selectedClassName = compareClassId === '__current__'
        ? (selClass?.name || 'Sınıf')
        : (classes.find(c => c.id === compareClassId)?.name || '');

      return (
        <div className="max-w-4xl mx-auto space-y-4 pt-10">
          <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
            <h2 className="text-3xl font-bold">Liderlik Tablosu</h2>
            <div className="flex flex-wrap items-center gap-2">
              {/* Zaman modu */}
              <button onClick={() => setRankMode('weekly')} className={`px-3 py-1 rounded-lg font-bold text-sm ${rankMode==='weekly' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Haftalık</button>
              <button onClick={() => setRankMode('all')} className={`px-3 py-1 rounded-lg font-bold text-sm ${rankMode==='all' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Genel</button>

              {/* Sınıf karşılaştırma dropdown */}
              {sameGradeClasses.length > 1 && (
                <div className="flex items-center gap-2 ml-2 border-l pl-3">
                  <span className="text-xs text-slate-500 font-bold">Sınıf:</span>
                  <select
                    value={compareClassId}
                    onChange={e => setCompareClassId(e.target.value)}
                    className="px-3 py-1 rounded-lg border-2 border-indigo-200 font-bold text-sm outline-none focus:border-indigo-500 bg-white">
                    <option value="__current__">{selClass?.name} (Bu Sınıf)</option>
                    {sameGradeClasses.filter(c => c.id !== selClass?.id).map(c => (
                      <option key={c.id} value={c.id}>{c.name}</option>
                    ))}
                  </select>
                </div>
              )}
            </div>
          </div>

          {/* Karşılaştırma başlığı */}
          {compareClassId !== '__current__' && (
            <div className="bg-indigo-50 border border-indigo-200 rounded-2xl p-3 text-center text-sm font-bold text-indigo-700">
              📊 {selectedClassName} sınıfının sıralaması gösteriliyor
              <button onClick={() => setCompareClassId('__current__')} className="ml-3 text-xs text-indigo-400 hover:text-indigo-600 underline">Kendi sınıfıma dön</button>
            </div>
          )}

          <div className="space-y-3">
            {displayStudents.map((s, i) => {
              const lvl = getLevelFromPoints(s.puan || 0);
              const pts = rankMode === 'weekly' ? getWeeklyPointsForStudent(s) : (s.puan || 0);
              const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : null;
              return (
                <div key={s.id} onClick={() => compareClassId === '__current__' && setDetailStudent(s)}
                  className={`bg-white p-4 rounded-2xl shadow flex items-center justify-between transition-all ${compareClassId === '__current__' ? 'cursor-pointer hover:scale-[1.01]' : ''} ${i < 3 ? 'border-l-4 border-indigo-500' : ''}`}>
                  <div className="flex items-center gap-4">
                    <div className="text-2xl font-extrabold text-slate-400 min-w-[40px] text-center">
                      {medal || `#${i+1}`}
                    </div>
                    <div>
                      <div className="font-bold text-slate-700">{s.name}</div>
                      <div className="text-xs text-slate-400 flex items-center gap-1">
                        <span>{avatarForLevel(lvl)}</span>
                        <span>{labelForLevel(lvl)} · Lv {lvl}</span>
                        <span className="opacity-50">·</span>
                        <span>{s.badges?.length || 0} rozet</span>
                      </div>
                    </div>
                  </div>
                  <div className="text-right">
                    <div className="text-2xl font-bold text-indigo-600">{pts} P</div>
                    <div className="text-xs text-slate-400">{rankMode === 'weekly' ? 'Son 7 gün' : 'Genel'}</div>
                  </div>
                </div>
              );
            })}
            {displayStudents.length === 0 && (
              <div className="text-center py-12 text-slate-400"><p>Bu sınıfta henüz öğrenci yok</p></div>
            )}
          </div>
        </div>
      );
    }

    // ==================== MAIN APP ====================
    function App() {
      const [page, setPage] = useState('dashboard');
      const [classes, setClasses] = useLocalStorageState('ap_v13_classes', []);
      const [selClass, setSelClass] = useState(null);
      const [students, setStudents] = useState([]);
      const [homeworks, setHomeworks] = useState([]);
      const [exams, setExams] = useState([]);
      const [drawnStudents, setDrawnStudents] = useState([]);
      const [detailStudent, setDetailStudent] = useState(null);
      const fileInputRef = useRef(null);

      const [levelFlashIds, setLevelFlashIds] = useState([]);
      const [examTimer, setExamTimer] = useLocalStorageState('exam_timer', { running:false, examId:'', label:'', remaining:0, paused:false, lastUpdated: Date.now(), classId: null });
      const [rankMode, setRankMode] = useState('weekly');

      useAutoBackup(classes);

      useEffect(()=> {
        if (selClass) {
          setStudents(storage.get(`s13_${selClass.id}`, []));
          setHomeworks(storage.get(`h13_${selClass.id}`, []));
          setExams(storage.get(`e13_${selClass.id}`, []));
         setDrawnStudents(storage.get(`draw13_${selClass.id}`, []));
        } else { 
          setStudents([]); 
          setHomeworks([]); 
          setExams([]); 
          setDrawnStudents([]); 
        }
      }, [selClass]);

      const awardBadge = useCallback((studentId, badgeId) => {
        if (!selClass) return;
        setStudents(prev => {
          const updated = prev.map(s => {
            if (s.id === studentId) {
              const existing = (s.badges || []).map(b => typeof b === 'string' ? b : b.id);
              if (existing.includes(badgeId)) return s;
              const newBadges = [...(s.badges || []), { id: badgeId, earnedAt: new Date().toISOString() }];
              return { ...s, badges: newBadges };
            }
            return s;
          });
          storage.set(`s13_${selClass.id}`, updated);
          if (detailStudent?.id) {
            const ds = updated.find(x => x.id === detailStudent.id);
            if (ds) setDetailStudent(ds);
          }
          return updated;
        });
      }, [selClass, detailStudent]);

      const awardBadgeToAllStudents = useCallback((badgeId) => {
        if (!selClass) return;
        setStudents(prev => {
          const updated = prev.map(s => {
            const existing = (s.badges || []).map(b => typeof b === 'string' ? b : b.id);
            if (existing.includes(badgeId)) return s;
            return { ...s, badges: [...(s.badges||[]), { id: badgeId, earnedAt: new Date().toISOString() }] };
          });
          storage.set(`s13_${selClass.id}`, updated);
          return updated;
        });
      }, [selClass]);

      const computeHomeworkStreakForStudent = useCallback((studentId, count) => {
        if (!Array.isArray(homeworks) || homeworks.length === 0) return 0;
        const last = [...homeworks].slice(-count);
        let streak = 0;
        for (let i = last.length - 1; i >=0; i--) {
          const res = last[i].results?.[studentId];
          if (res === 'done') streak++; else break;
        }
        return streak;
      }, [homeworks]);

      const handleCheckHomeworkBadgesForStudent = useCallback((studentId) => {
        BADGES.filter(b => b.trigger === 'homework_streak').forEach(b => {
          const need = b.conditions.count;
          const streak = computeHomeworkStreakForStudent(studentId, need);
          if (streak >= need) awardBadge(studentId, b.id);
        });
      }, [computeHomeworkStreakForStudent, awardBadge]);

      const handleWheelSelected = useCallback((studentId) => {
        setStudents(prev => {
          const updated = prev.map(s => {
            if (s.id === studentId) {
              const wc = (s.wheelCount || 0) + 1;
              return { ...s, wheelCount: wc };
            }
            return s;
          });
          if (selClass) storage.set(`s13_${selClass.id}`, updated);
          updated.forEach(s => {
            if (s.id === studentId && (s.wheelCount || 0) >= 5) awardBadge(studentId, 'wheel_selected_5');
          });
          return updated;
        });
      }, [awardBadge, selClass]);

      const getWeeklyPointsForStudent = useCallback((s) => {
        if (!s || !Array.isArray(s.logs)) return 0;
        const now = Date.now();
        const weekAgo = now - (7 * 24 * 60 * 60 * 1000);
        return s.logs.reduce((sum, l) => {
          try {
            const t = new Date(l.date).getTime();
            if (!isNaN(t) && t >= weekAgo) return sum + Number(l.amount || 0);
          } catch(e){}
          return sum;
        }, 0);
      }, []);

      const addLog = useCallback((stdId, type, amount, reason) => {
        setStudents(prev => {
          const updated = prev.map(s => {
            if (s.id === stdId) {
              const oldP = Number(s.puan) || 0;
              const newP = oldP + Number(amount);
              const newLog = { date: new Date().toISOString(), type, amount: Number(amount), reason: sanitize(reason), currentTotal: newP };
              const oldLvl = getLevelFromPoints(oldP);
              const newLvl = getLevelFromPoints(newP);
              if (newLvl > oldLvl) {
                try { playLevelUpSound(); } catch {}
                setLevelFlashIds(prevIds => {
                  if (prevIds.includes(s.id)) return prevIds;
                  setTimeout(()=> setLevelFlashIds(ids => ids.filter(id => id !== s.id)), 2600);
                  return [...prevIds, s.id];
                });
              }
              return { ...s, puan:newP, logs: [ newLog, ...(s.logs || []) ] };
            }
            return s;
          });
          if (selClass) storage.set(`s13_${selClass.id}`, updated);
          if (detailStudent?.id === stdId) setDetailStudent(updated.find(x => x.id === stdId));
          try {
            if (type === 'ÖDEV') {
              handleCheckHomeworkBadgesForStudent(stdId);
            }
          } catch (e) { console.error(e); }
          return updated;
        });
      }, [selClass, detailStudent, handleCheckHomeworkBadgesForStudent]);

      const saveStudents = useCallback((newStudents) => { 
        setStudents(newStudents); 
        if (selClass) storage.set(`s13_${selClass.id}`, newStudents); 
      }, [selClass]);

      const saveHomeworks = useCallback((newHomeworks) => {
        setHomeworks(newHomeworks); 
        if (selClass) storage.set(`h13_${selClass.id}`, newHomeworks);
        students.forEach(s => {
          BADGES.filter(b => b.trigger === 'homework_streak').forEach(b => {
            const need = b.conditions.count;
            const last = [...newHomeworks].slice(-need);
            let streak = 0;
            for (let i = last.length - 1; i >=0; i--) {
              const res = last[i].results?.[s.id];
              if (res === 'done') streak++; else break;
            }
            if (streak >= need) awardBadge(s.id, b.id);
          });
        });
      }, [selClass, students, awardBadge]);

      const saveExams = useCallback((newExams) => {
        setExams(newExams); 
        if (selClass) storage.set(`e13_${selClass.id}`, newExams);
        setTimeout(()=> {
          if (Array.isArray(newExams) && newExams.length > 0) {
            const lastExam = newExams[newExams.length-1];


// ==================== EXAM POINT SYSTEM (Top 10) ====================
const ranking = [...students]
  .map(s => ({
    id: s.id,
    net: Number(lastExam.results?.[s.id]?.net || 0)
  }))
  .sort((a, b) => b.net - a.net);

// İlk 10 kişiye puan ver (10 → 1)

            const prevExam = newExams[newExams.length-2];
            students.forEach(s => {
              const latestNet = Number(lastExam.results?.[s.id]?.net || 0);
              if (prevExam) {
                const prevNet = Number(prevExam.results?.[s.id]?.net || 0);
                if (prevNet > 0) {
                  const percent = ((latestNet - prevNet) / Math.abs(prevNet)) * 100;
                  if (percent >= 20) awardBadge(s.id, 'exam_improve_20');
                }
              }
              const qCount = Number(lastExam.qCount || 0);
              if (qCount > 0) {
                const percentOfTotal = (latestNet / qCount) * 100;
                if (percentOfTotal >= 95) awardBadge(s.id, 'perfect_exam');
              }
            });
          }
        }, 120);
      }, [selClass, students, awardBadge, addLog]);


      const handleAddClass = () => { 
        const name = prompt('Sınıf Adı:'); 
        const cleaned = sanitize(name); 
        if (cleaned) { 
          setClasses([...classes, { id: generateId(), name: cleaned }]); 
        } 
      };

      const handleDeleteClass = (id) => { 
        if (!confirm('Bu sınıf silinecek. Emin misiniz?')) return; 
        setClasses(classes.filter(c=>c.id!==id)); 
        storage.remove(`s13_${id}`); 
        storage.remove(`h13_${id}`); 
        storage.remove(`e13_${id}`); 
        if (selClass?.id===id) { 
          setSelClass(null); 
          setPage('dashboard'); 
        } 
      };

      const handleAddStudent = (name) => {
        const s = { id: generateId(), name, puan:0, logs:[], badges:[], wheelCount:0 };
        saveStudents([...students, s]);
      };

      const handleAddBulkStudents = (names) => {
        const newOnes = names.map(n=>({ id: generateId(), name:n, puan:0, logs:[], badges:[], wheelCount:0 }));
        saveStudents([...students, ...newOnes]);
      };

      const handleDeleteStudent = (id) => { 
        if (!confirm('Bu öğrenci silinecek. Emin misiniz?')) return; 
        saveStudents(students.filter(s=>s.id!==id)); 
      };

      const handleBackup = () => makeBackup(classes);
      const handleRestoreClick = () => fileInputRef.current?.click();
      const handleFileChange = async (ev) => {
        const file = ev.target.files?.[0]; 
        if (!file) return;
        const res = await restoreFromBackupFile(file);
        if (res.success) { 
          setClasses(res.parsed.classes); 
          if (res.parsed.classes.length>0) setSelClass(res.parsed.classes[0]); 
          alert('Yedek başarıyla yüklendi.'); 
        } else { 
          alert('Yedek yüklenemedi: ' + (res.message || 'Hata')); 
        }
        ev.target.value = '';
      };

      const handleRemoveStudent = (id) => saveStudents(students.filter(s=>s.id!==id));

      const incrementClassSilencePoints = useCallback((amount = 1) => {
        if (!selClass) return;
        const key = `class_silence_${selClass.id}`;
        const cur = storage.get(key, 0) || 0;
        const nv = cur + amount;
        storage.set(key, nv);
        const silenceBadge = BADGES.find(b => b.id === 'silence_master');
        if (silenceBadge && nv >= (silenceBadge.conditions.points || 50)) {
          awardBadgeToAllStudents('silence_master');
          storage.set(key, 0);
          alert('Sessizlik hedefi aşıldı — tüm öğrencilere "Sessizlik Şampiyonu" rozetleri verildi!');
        }
      }, [selClass, awardBadgeToAllStudents]);

      useEffect(()=> {
        let id = null;
        if (examTimer && examTimer.running) {
          id = setInterval(()=> {
            setExamTimer(prev => {
              if (!prev || !prev.running) return prev;
              const now = Date.now();
              const elapsed = Math.round((now - (prev.lastUpdated || now)) / 1000);
              const remaining = Math.max(0, (prev.remaining || 0) - elapsed);
              if (remaining <= 0) {
                try { playFinalSound(); } catch {}
                alert(`${prev.label} sınav zamanlayıcısı bitti!`);
                return { running:false, examId:'', label:'', remaining:0, paused:false, lastUpdated: now, classId: null };
              }
              return { ...prev, remaining, lastUpdated: now };
            });
          }, 800);
        }
        return ()=> { if (id) clearInterval(id); };
      }, [examTimer && examTimer.running]);

      function startExamTimer(examId, label, seconds) {
        if (!selClass) { alert('Önce sınıf seçin'); return; }
        setExamTimer({ running:true, examId, label, remaining: seconds, paused:false, lastUpdated: Date.now(), classId: selClass.id });
      }
      function pauseExamTimer() {
        setExamTimer(prev => {
          if (!prev || !prev.running) return prev;
          const now = Date.now();
          const elapsed = Math.round((now - (prev.lastUpdated || now)) / 1000);
          const newRemaining = Math.max(0, (prev.remaining || 0) - elapsed);
          return { ...prev, running:false, paused:true, remaining:newRemaining, lastUpdated: now };
        });
      }
      function resumeExamTimer() {
        setExamTimer(prev => {
          if (!prev || !prev.paused) return prev;
          return { ...prev, running:true, paused:false, lastUpdated: Date.now() };
        });
      }
      function stopExamTimer() {
        setExamTimer({ running:false, examId:'', label:'', remaining:0, paused:false, lastUpdated: Date.now(), classId: null });
      }
      const formatSec = (s) => { const m = String(Math.floor(s/60)).padStart(2,'0'); const sec = String(s%60).padStart(2,'0'); return `${m}:${sec}`; };

      const rankingData = useCallback(() => {
        if (!Array.isArray(students)) return [];
        if (rankMode === 'weekly') {
          return [...students].map(s => ({ ...s, weeklyPoints: getWeeklyPointsForStudent(s) }))
            .sort((a,b) => (b.weeklyPoints || 0) - (a.weeklyPoints || 0));
        }
        return [...students].sort((a,b) => (b.puan||0) - (a.puan||0));
      }, [students, rankMode, getWeeklyPointsForStudent]);

      function resetStudentPoints(studentId) {
        if (!selClass) return;
        const key = `reset_backup_${selClass.id}_${studentId}`;
        const cur = students.find(s => s.id === studentId);
        if (!cur) return;
        storage.set(key, cur);
        setStudents(prev => {
          const updated = prev.map(s => {
            if (s.id === studentId) {
              const oldP = Number(s.puan) || 0;
              const newLog = { date: new Date().toISOString(), type: 'SIFIRLAMA', amount: -oldP, reason: 'Puan sıfırlama', currentTotal: 0 };
              return { ...s, puan: 0, logs: [ newLog, ...(s.logs || []) ] };
            }
            return s;
          });
          storage.set(`s13_${selClass.id}`, updated);
          if (detailStudent?.id === studentId) setDetailStudent(updated.find(x => x.id === studentId));
          return updated;
        });
      }
      function restoreStudentPoints(studentId) {
        if (!selClass) return;
        const key = `reset_backup_${selClass.id}_${studentId}`;
        const bak = storage.get(key, null);
        if (!bak) { alert('Geri alınacak bir yedek bulunamadı.'); return; }
        setStudents(prev => {
          const updated = prev.map(s => s.id === studentId ? bak : s);
          storage.set(`s13_${selClass.id}`, updated);
          storage.remove(key);
          if (detailStudent?.id === studentId) setDetailStudent(updated.find(x => x.id === studentId));
          return updated;
        });
      }

      function resetClassPoints() {
        if (!selClass) return;
        if (!confirm(`Tüm öğrencilerin puanları sıfırlanacak — ${selClass.name}. Devam edilsin mi?`)) return;
        const key = `reset_backup_class_${selClass.id}`;
        storage.set(key, students);
        setStudents(prev => {
          const updated = prev.map(s => {
            const oldP = Number(s.puan) || 0;
            const newLog = { date: new Date().toISOString(), type: 'SINIF_SIFIRLAMA', amount: -oldP, reason: 'Sınıf puan sıfırlama', currentTotal: 0 };
            return { ...s, puan: 0, logs: [ newLog, ...(s.logs || []) ] };
          });
          storage.set(`s13_${selClass.id}`, updated);
          return updated;
        });
        alert('Sınıf puanları sıfırlandı ve yedeklendi.');
      }
      function restoreClassPoints() {
        if (!selClass) return;
        const key = `reset_backup_class_${selClass.id}`;
        const bak = storage.get(key, null);
        if (!bak) { alert('Sınıf yedeği bulunamadı.'); return; }
        if (!confirm('Sınıf yedeği geri yüklenecek. Mevcut puanlar üzerine yazılacak. Onaylıyorsanız devam edin.')) return;
        setStudents(bak);
        storage.set(`s13_${selClass.id}`, bak);
        storage.remove(key);
        alert('Sınıf puanları geri yüklendi.');
      }

      function manualAddForStudent(studentId, amount) {
        addLog(studentId, 'MANUEL', amount, 'Hızlı Manuel (Listeden)');
      }

      useEffect(()=> {
        if (!classes || classes.length === 0) {
          const sample = [{ id:'c_demo', name:'7-A' }];
          setClasses(sample);
          storage.set('ap_v13_classes', sample);
          const studs = [
            { id:'s1', name:'Ayşe', puan:95, logs:[], badges:[], wheelCount:0 },
            { id:'s2', name:'Emre', puan:120, logs:[], badges:[], wheelCount:0 },
            { id:'s3', name:'Zeynep', puan:215, logs:[], badges:[], wheelCount:0 }
          ];
          storage.set('s13_c_demo', studs);
        }
      }, []);

      return (
        <ErrorBoundary>
          <div className="min-h-screen">
            <nav className="bg-gradient-to-r from-slate-900 to-indigo-900 text-white p-4 flex justify-between items-center border-b-4 border-indigo-600">
              <div className="flex items-center gap-4">
                <h1 onClick={()=>{ setPage('dashboard'); setSelClass(null); }} className="text-xl font-bold cursor-pointer flex items-center gap-2">Asistan <span style={{color:'#a78bfa'}}>Pro V16</span></h1>
                <div className="hidden md:flex items-center gap-3 text-sm text-slate-200">
                  <span className="opacity-80">Sınıf: </span>
                  {selClass ? <span className="bg-indigo-600 px-3 py-1 rounded text-xs font-bold">{selClass.name}</span> : <span className="text-slate-400">Henüz seçili değil</span>}
                </div>
              </div>

              <div className="nav-action">
                <button onClick={handleBackup} title="Yedekle" className="bg-indigo-500 hover:bg-indigo-400 small-btn text-white flex items-center gap-2"><Download className="w-4 h-4" /> Yedekle</button>
                <button onClick={handleRestoreClick} title="Yedekten Yükle" className="bg-white/10 hover:bg-white/20 small-btn text-white flex items-center gap-2"><Upload className="w-4 h-4" /> Yükle</button>
                <input ref={fileInputRef} type="file" accept="application/json" onChange={handleFileChange} className="hidden" />
              </div>
            </nav>

            <main className="p-6 max-w-7xl mx-auto">
              {page==='dashboard' && <Dashboard classes={classes} onAddClass={handleAddClass} onSelectClass={(c)=>{ setSelClass(c); setPage('list'); }} onDeleteClass={handleDeleteClass} />}

              {selClass && (
                <>
                  <div className="flex flex-wrap gap-2 p-2 bg-white rounded-2xl w-fit shadow-sm border mx-auto md:mx-0 mb-6">
                    <button className={`px-3 py-2 rounded-xl font-bold text-xs ${page==='list' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`} onClick={()=>setPage('list')}>Öğrenci</button>
                    <button className={`px-3 py-2 rounded-xl font-bold text-xs ${page==='hw' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`} onClick={()=>setPage('hw')}>Ödev</button>
                    <button className={`px-3 py-2 rounded-xl font-bold text-xs ${page==='wheel' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`} onClick={()=>setPage('wheel')}>Kura</button>
                    <button className={`px-3 py-2 rounded-xl font-bold text-xs ${page==='exam' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`} onClick={()=>setPage('exam')}>Sınav</button>
                    <button className={`px-3 py-2 rounded-xl font-bold text-xs ${page==='stats' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`} onClick={()=>setPage('stats')}>Analiz</button>
                    <button className={`px-3 py-2 rounded-xl font-bold text-xs ${page==='rank' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`} onClick={()=>setPage('rank')}>Liderlik</button>
                    <button className={`px-3 py-2 rounded-xl font-bold text-xs ${page==='daily' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`} onClick={()=>setPage('daily')}>Günün Sorusu</button>
                    <button className={`px-3 py-2 rounded-xl font-bold text-xs ${page==='tools' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`} onClick={()=>setPage('tools')}>Araçlar</button>
                  </div>

                  {page==='list' && <StudentList students={students} onAddStudent={handleAddStudent} onAddBulk={handleAddBulkStudents} onDeleteStudent={handleDeleteStudent} levelFlashIds={levelFlashIds} onManualAdd={manualAddForStudent} />}

                  {page==='hw' && <HomeworkManager students={students} homeworks={homeworks} onSaveHomeworks={saveHomeworks} onAddLog={addLog} />}

                  {page==='wheel' && <NameScroller students={students} drawnStudents={drawnStudents} onDraw={(id)=>{ 
  setDrawnStudents(prev=>{ 
    const updated = [...prev, id];
    storage.set(`draw13_${selClass.id}`, updated);
    return updated;
  }); 
  handleWheelSelected(id); 
}}

onReset={()=>{
  setDrawnStudents([]);
  storage.set(`draw13_${selClass.id}`, []);
}}

onAddLog={addLog} onRemoveStudent={handleRemoveStudent} />}

{page==='exam' && (
  <ExamManager
    students={students}
    exams={exams}
    onSaveExams={saveExams}
    onStartExamTimer={startExamTimer}
    onAddLog={addLog}
  />
)}

                  {page==='stats' && <StatsPage students={students} exams={exams} onShowDetail={setDetailStudent} />}

                  {page==='rank' && (
                    <RankPage
                      students={students}
                      classes={classes}
                      selClass={selClass}
                      rankMode={rankMode}
                      setRankMode={setRankMode}
                      rankingData={rankingData}
                      getWeeklyPointsForStudent={getWeeklyPointsForStudent}
                      setDetailStudent={setDetailStudent}
                      storage={storage}
                    />
                  )}

                  {page==='daily' && <DailyQuestions students={students} addLog={addLog} />}

                  {page==='tools' && (
                    <div className="max-w-3xl mx-auto space-y-6">
                      <div className="text-center text-slate-700 font-bold mb-2">Sınıf Ses Ölçer (Sessizlik Puanları)</div>
                      <SoundMeter threshold={0.08} initialGain={1.0} onAboveThreshold={(lvl)=>{ }} onBelowThreshold={(lvl)=>{ }} onClassSilenceIncrement={(amt) => { incrementClassSilencePoints(amt); }} />
                      <div className="text-sm text-slate-500 mt-2">Sessizlik Puanları sınıf bazında toplanır; hedefe ulaştığında rozetler sınıfa verilir.</div>

                      <div className="bg-white p-4 rounded-2xl shadow">
                        <h4 className="text-sm font-bold text-indigo-600">Puan Yönetimi (Sınıf / Bireysel)</h4>
                        <div className="mt-3 text-sm text-slate-600">Buradan tüm sınıfın puanlarını sıfırlayabilir veya önceden alınmış sınıf yedeğini geri yükleyebilirsiniz. Ayrıca sınıf içindeki bireysel yedeklerin de yönetimi StudentDetail içinden yapılır.</div>
                        <div className="mt-4 flex gap-3">
                          <button onClick={resetClassPoints} className="px-4 py-2 bg-rose-500 text-white rounded-md font-bold">Sınıfı Sıfırla (Yedekle)</button>
                          <button onClick={restoreClassPoints} className="px-4 py-2 bg-indigo-600 text-white rounded-md font-bold">Sınıfı Geri Yükle</button>
                        </div>
                        <div className="mt-3 text-xs text-slate-400">Not: Sıfırlama işleminden önce mevcut öğrenci verileri localStorage'a yedeklenir.</div>
                      </div>
                    </div>
                  )}
                </>
              )}
            </main>

            {detailStudent && <StudentDetail student={detailStudent} students={students} exams={exams} onClose={()=>setDetailStudent(null)} onAddLog={addLog} onResetPoints={resetStudentPoints} onRestorePoints={restoreStudentPoints} />}

            {examTimer && (examTimer.running || examTimer.paused) && examTimer.classId === (selClass && selClass.id) && (
              <div className="exam-overlay" role="status" aria-live="polite">
                <div className="label">{examTimer.label} — Sınav</div>
                <div className="time">{formatSec(examTimer.remaining)}</div>
                <div className="controls">
                  {examTimer.running ? (
                    <button onClick={pauseExamTimer} className="px-3 py-1 rounded-md bg-white text-indigo-700 font-bold">Duraklat</button>
                  ) : (
                    <button onClick={resumeExamTimer} className="px-3 py-1 rounded-md bg-white text-indigo-700 font-bold">Sürdür</button>
                  )}
                  <button onClick={stopExamTimer} className="px-3 py-1 rounded-md bg-rose-500 text-white font-bold">Durdur</button>
                </div>
              </div>
            )}

            <LeaderboardScroller students={students} />
          </div>
        </ErrorBoundary>
      );
    }

    // ==================== START ====================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
